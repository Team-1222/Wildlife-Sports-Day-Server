name: wildlife-production

services:
  db:
    image: postgres:18.4-alpine3.24
    env_file:
      - /etc/wildlife/db.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrator:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE is required}
    env_file:
      - /etc/wildlife/app.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file:
      - /etc/wildlife/app.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - app
    env_file:
      - /etc/wildlife/caddy.env
    ports:
      - "127.0.0.1:18080:8080"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/wildlife/infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
    name: wildlife-postgres-data
  app-dataprotection:
    name: wildlife-app-dataprotection
  caddy-data:
    name: wildlife-caddy-data
  caddy-config:
    name: wildlife-caddy-config
