name: wildlife-production

services:
  db:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    env_file:
      - /etc/wildlife/db.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrator:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE is required}
    env_file:
      - /etc/wildlife/connection.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/dotnet-bundle:rw,exec,nosuid,nodev,size=64m,uid=1654,gid=1654,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file:
      - /etc/wildlife/app.env
      - /etc/wildlife/connection.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - app
    ports:
      - "0.0.0.0:18080:8080"
    volumes:
      - /opt/wildlife/infra/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m
      - /config:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
    name: wildlife-postgres-data
  app-dataprotection:
    name: wildlife-app-dataprotection
