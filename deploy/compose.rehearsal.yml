services:
  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend

  migrator:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE is required}
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:${REHEARSAL_PORT:-18080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m
      - /config:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  app-dataprotection:
