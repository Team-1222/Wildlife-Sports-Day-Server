name: Server Delivery and Deployment

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: server-delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server
  MIGRATOR_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server-migrator

jobs:
  validate:
    name: Validate application
    uses: ./.github/workflows/ci.yml

  deliver-develop:
    name: Publish development images
    if: github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.APP_IMAGE }}:dev-${{ github.sha }}
            ${{ env.APP_IMAGE }}:develop
          cache-from: type=gha,scope=develop-app
          cache-to: type=gha,mode=max,scope=develop-app

      - name: Build and publish migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:dev-${{ github.sha }}
            ${{ env.MIGRATOR_IMAGE }}:develop
          cache-from: type=gha,scope=develop-migrator
          cache-to: type=gha,mode=max,scope=develop-migrator

  publish-release-candidate:
    name: Publish release candidate images
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      source-tree: ${{ steps.source.outputs.tree }}
      app-reference: ${{ steps.candidate.outputs.app-reference }}
      migrator-reference: ${{ steps.candidate.outputs.migrator-reference }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve source tree
        id: source
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application candidate
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.APP_IMAGE }}:candidate-tree-${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=rehearsal-app
          cache-to: type=gha,mode=max,scope=rehearsal-app

      - name: Build and publish migrator candidate
        id: build-migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.MIGRATOR_IMAGE }}:candidate-tree-${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=rehearsal-migrator
          cache-to: type=gha,mode=max,scope=rehearsal-migrator

      - name: Export immutable candidate references
        id: candidate
        env:
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.build-migrator.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${APP_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${MIGRATOR_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'app-reference=%s@%s\n' "${APP_IMAGE}" "${APP_DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'migrator-reference=%s@%s\n' "${MIGRATOR_IMAGE}" "${MIGRATOR_DIGEST}" >> "${GITHUB_OUTPUT}"

  rehearse-release:
    name: Rehearse published release images
    if: startsWith(github.ref, 'refs/heads/release/')
    needs:
      - validate
      - publish-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: wildlife-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_TREE: ${{ needs.publish-release-candidate.outputs.source-tree }}
      REHEARSAL_APP_IMAGE: ${{ needs.publish-release-candidate.outputs.app-reference }}
      REHEARSAL_MIGRATOR_IMAGE: ${{ needs.publish-release-candidate.outputs.migrator-reference }}
      POSTGRES_DB: wildlife_rehearsal
      POSTGRES_USER: wildlife_rehearsal
      REHEARSAL_GMAIL_ADDRESS: rehearsal@example.invalid
      REHEARSAL_GMAIL_APP_PASSWORD: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate rehearsal Compose
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml config --quiet

      - name: Start rehearsal database
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml up -d --wait db

      - name: Apply migrations twice
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: |
          docker compose -f deploy/compose.rehearsal.yml run --rm migrator
          docker compose -f deploy/compose.rehearsal.yml run --rm migrator

      - name: Start rehearsal application
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml up -d app caddy

      - name: Verify health response
        run: |
          response="$(curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:18080/api/health)"
          jq -e '.success == true and .data.status == "Healthy"' <<< "${response}"

      - name: Mark rehearsed image manifests as verified
        run: |
          set -Eeuo pipefail

          [[ "${SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]

          mark_verified() {
            local image="$1"
            local source_reference="$2"
            local source_digest="${source_reference##*@}"
            local verified_digest
            local metadata_file

            [[ "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            metadata_file="$(mktemp)"

            docker buildx imagetools create \
              --tag "${image}:verified-tree-${SOURCE_TREE}" \
              --prefer-index=false \
              --metadata-file "${metadata_file}" \
              "${source_reference}"

            verified_digest="$(
              jq -er '."containerimage.descriptor".digest
                | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}"
            )"
            rm -f -- "${metadata_file}"

            [[ "${verified_digest}" == "${source_digest}" ]]
          }

          mark_verified "${APP_IMAGE}" "${REHEARSAL_APP_IMAGE}"
          mark_verified "${MIGRATOR_IMAGE}" "${REHEARSAL_MIGRATOR_IMAGE}"

      - name: Print rehearsal logs on failure
        if: failure()
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml logs --no-color

      - name: Remove rehearsal resources
        if: always()
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml down --volumes --remove-orphans

  promote-production:
    name: Promote rehearsed images
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.promote.outputs.app-digest }}
      migrator-digest: ${{ steps.promote.outputs.migrator-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve source tree
        id: source
        run: printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image manifests
        id: promote
        env:
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -Eeuo pipefail

          [[ "${SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]

          promote_image() {
            local image="$1"
            local output_name="$2"
            local source_tag="${image}:verified-tree-${SOURCE_TREE}"
            local source_digest
            local promoted_digest
            local metadata_file

            source_digest="$(
              docker buildx imagetools inspect "${source_tag}" \
                --format '{{json .Manifest.Digest}}' \
                | jq -er 'select(type == "string" and test("^sha256:[0-9a-f]{64}$"))'
            )"
            metadata_file="$(mktemp)"

            docker buildx imagetools create \
              --tag "${image}:sha-${GITHUB_SHA}" \
              --tag "${image}:main" \
              --prefer-index=false \
              --metadata-file "${metadata_file}" \
              "${image}@${source_digest}"

            promoted_digest="$(
              jq -er '."containerimage.descriptor".digest
                | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}"
            )"
            rm -f -- "${metadata_file}"

            [[ "${promoted_digest}" == "${source_digest}" ]]
            printf '%s=%s\n' "${output_name}" "${promoted_digest}" >> "${GITHUB_OUTPUT}"
          }

          promote_image "${APP_IMAGE}" app-digest
          promote_image "${MIGRATOR_IMAGE}" migrator-digest

  deploy-production:
    name: Deploy production to WSL over Tailscale SSH
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
      - promote-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:wildlife-ci
          ping: ${{ vars.TS_HOST }}

      - name: Create deployment request
        env:
          APP_DIGEST: ${{ needs.promote-production.outputs.app-digest }}
          MIGRATOR_DIGEST: ${{ needs.promote-production.outputs.migrator-digest }}
        run: |
          umask 077
          {
            printf 'RELEASE_ID=%s\n' "${GITHUB_SHA}"
            printf 'APP_IMAGE=%s@%s\n' "${APP_IMAGE}" "${APP_DIGEST}"
            printf 'MIGRATOR_IMAGE=%s@%s\n' "${MIGRATOR_IMAGE}" "${MIGRATOR_DIGEST}"
          } > deployment-request.env

      - name: Upload deployment request
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -- \
            deployment-request.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/wildlife/inbox/deployment-request.env"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -- \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/local/sbin/wildlife-deploy apply'
