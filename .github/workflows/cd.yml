name: Server Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: server-production
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server
  MIGRATOR_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server-migrator

jobs:
  validate:
    name: Validate application
    uses: ./.github/workflows/ci.yml

  publish-candidate:
    name: Publish production candidate images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app-reference: ${{ steps.candidate.outputs.app-reference }}
      migrator-reference: ${{ steps.candidate.outputs.migrator-reference }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application candidate
        id: build-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.APP_IMAGE }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app

      - name: Build and publish migrator candidate
        id: build-migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.MIGRATOR_IMAGE }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=production-migrator
          cache-to: type=gha,mode=max,scope=production-migrator

      - name: Export immutable candidate references
        id: candidate
        env:
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.build-migrator.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${APP_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${MIGRATOR_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'app-reference=%s@%s\n' "${APP_IMAGE}" "${APP_DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'migrator-reference=%s@%s\n' "${MIGRATOR_IMAGE}" "${MIGRATOR_DIGEST}" >> "${GITHUB_OUTPUT}"

  rehearse-candidate:
    name: Rehearse production candidate images
    needs:
      - validate
      - publish-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: wildlife-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
      REHEARSAL_APP_IMAGE: ${{ needs.publish-candidate.outputs.app-reference }}
      REHEARSAL_MIGRATOR_IMAGE: ${{ needs.publish-candidate.outputs.migrator-reference }}
      POSTGRES_DB: wildlife_rehearsal
      POSTGRES_USER: wildlife_rehearsal
      REHEARSAL_GMAIL_ADDRESS: rehearsal@example.invalid
      REHEARSAL_GMAIL_APP_PASSWORD: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate rehearsal Compose
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml config --quiet

      - name: Pull rehearsal images
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml pull

      - name: Start rehearsal database
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml up -d --wait db

      - name: Apply migrations twice
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: |
          docker compose -f deploy/compose.rehearsal.yml run --rm migrator
          docker compose -f deploy/compose.rehearsal.yml run --rm migrator

      - name: Start rehearsal application
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml up -d app caddy

      - name: Verify health response
        run: |
          response="$(curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:18080/api/health)"
          jq -e '.success == true and .data.status == "Healthy"' <<< "${response}"

      - name: Print rehearsal logs on failure
        if: failure()
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml logs --no-color

      - name: Remove rehearsal resources
        if: always()
        env:
          APP_IMAGE: ${{ env.REHEARSAL_APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.REHEARSAL_MIGRATOR_IMAGE }}
        run: docker compose -f deploy/compose.rehearsal.yml down --volumes --remove-orphans

  promote-production:
    name: Promote rehearsed images
    needs:
      - publish-candidate
      - rehearse-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.promote.outputs.app-digest }}
      migrator-digest: ${{ steps.promote.outputs.migrator-digest }}

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote rehearsed image manifests
        id: promote
        env:
          APP_SOURCE_REFERENCE: ${{ needs.publish-candidate.outputs.app-reference }}
          MIGRATOR_SOURCE_REFERENCE: ${{ needs.publish-candidate.outputs.migrator-reference }}
        run: |
          set -Eeuo pipefail

          promote_image() {
            local image="$1"
            local source_reference="$2"
            local output_name="$3"
            local source_digest="${source_reference##*@}"
            local promoted_digest
            local metadata_file

            [[ "${source_reference}" == "${image}@${source_digest}" ]]
            [[ "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            metadata_file="$(mktemp)"

            docker buildx imagetools create \
              --tag "${image}:sha-${GITHUB_SHA}" \
              --tag "${image}:main" \
              --prefer-index=false \
              --metadata-file "${metadata_file}" \
              "${source_reference}"

            promoted_digest="$(
              jq -er '."containerimage.descriptor".digest
                | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}"
            )"
            rm -f -- "${metadata_file}"

            [[ "${promoted_digest}" == "${source_digest}" ]]
            printf '%s=%s\n' "${output_name}" "${promoted_digest}" >> "${GITHUB_OUTPUT}"
          }

          promote_image "${APP_IMAGE}" "${APP_SOURCE_REFERENCE}" app-digest
          promote_image "${MIGRATOR_IMAGE}" "${MIGRATOR_SOURCE_REFERENCE}" migrator-digest

  deploy-production:
    name: Deploy production to WSL over Tailscale SSH
    needs: promote-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:wildlife-ci
          ping: ${{ vars.TS_HOST }}

      - name: Create deployment request
        env:
          APP_DIGEST: ${{ needs.promote-production.outputs.app-digest }}
          MIGRATOR_DIGEST: ${{ needs.promote-production.outputs.migrator-digest }}
        run: |
          umask 077
          {
            printf 'RELEASE_ID=%s\n' "${GITHUB_SHA}"
            printf 'APP_IMAGE=%s@%s\n' "${APP_IMAGE}" "${APP_DIGEST}"
            printf 'MIGRATOR_IMAGE=%s@%s\n' "${MIGRATOR_IMAGE}" "${MIGRATOR_DIGEST}"
          } > deployment-request.env

      - name: Upload deployment request
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -- \
            deployment-request.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/wildlife/inbox/deployment-request.env"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -- \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/local/sbin/wildlife-deploy apply'
