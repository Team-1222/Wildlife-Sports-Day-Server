name: Server Development CI/CD

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-development-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server
  MIGRATOR_IMAGE: ghcr.io/team-1222/wildlife-sports-day-server-migrator

jobs:
  validate:
    name: Validate application
    uses: ./.github/workflows/ci.yml

  publish-development:
    name: Publish development images
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development application
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.APP_IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=development-app
          cache-to: type=gha,mode=max,scope=development-app

      - name: Build and publish development migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.MIGRATOR_IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=development-migrator
          cache-to: type=gha,mode=max,scope=development-migrator
