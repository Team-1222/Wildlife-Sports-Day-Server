name: Verify Deployment Connection

on:
  push:
    branches:
      - fix/tailscale-connection-check-20260910
    paths:
      - .github/workflows/verify-deployment-connection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildlife-connection-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Tailscale OIDC and read-only SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate configured values without printing secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_HOST: ${{ vars.TS_HOST }}
          TS_SSH_USER: ${{ vars.TS_SSH_USER }}
        run: |
          python3 - <<'PY'
          import os
          import re
          for name in ('TS_OAUTH_CLIENT_ID', 'TS_AUDIENCE', 'TS_HOST', 'TS_SSH_USER'):
              value = os.environ[name]
              if not value or any(character.isspace() for character in value):
                  raise SystemExit(f'::error::{name} is empty or contains whitespace.')
              print(f'{name}: nonempty, no whitespace')
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9.:-]*', os.environ['TS_HOST']):
              raise SystemExit('::error::TS_HOST is not a valid host argument.')
          if os.environ['TS_SSH_USER'] != 'deploy':
              raise SystemExit('::error::TS_SSH_USER must match the configured deploy account.')
          PY

      - name: Verify GitHub OIDC claims without printing the token
        env:
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          separator = '&' if '?' in url else '?'
          url += separator + urllib.parse.urlencode({'audience': os.environ['TS_AUDIENCE']})
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          print('::add-mask::' + token)
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          for name in ('iss', 'sub', 'ref', 'workflow_ref', 'environment'):
              print(f'{name}: {claims.get(name)}')
          expected = 'repo:Team-1222/Wildlife-Sports-Day-Server:environment:production'
          if claims.get('sub') != expected:
              raise SystemExit('::error::OIDC subject differs from the configured production subject.')
          if claims.get('aud') != os.environ['TS_AUDIENCE']:
              raise SystemExit('::error::OIDC audience differs from TS_AUDIENCE.')
          if claims.get('iss') != 'https://token.actions.githubusercontent.com':
              raise SystemExit('::error::Unexpected OIDC issuer.')
          print('OIDC issuer, subject and audience: verified')
          PY

      - name: Authenticate with Tailscale using production credentials
        id: tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:wildlife-ci
          hostname: wildlife-connection-check-${{ github.run_id }}
          retry: '2'

      - name: Verify Tailscale reachability
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
        run: |
          timeout 90s tailscale ping --c 10 --timeout 5s "${DEPLOY_HOST}"

      - name: Verify the production OpenSSH connection
        id: ssh
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          timeout 45s ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -- "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test "$(id -un)" = deploy && printf "SSH authenticated as deploy\n"'

      - name: Diagnose SSH using Tailscale host verification
        if: failure() && steps.tailscale.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          timeout 45s tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test "$(id -un)" = deploy && printf "Tailscale SSH authenticated as deploy\n"'

      - name: Verify installed deployment prerequisites without applying
        if: steps.ssh.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ vars.TS_HOST }}
          DEPLOY_USER: ${{ vars.TS_SSH_USER }}
        run: |
          timeout 45s ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -- "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n -l /usr/local/sbin/wildlife-deploy apply > /dev/null && sudo -n -l /usr/local/sbin/wildlife-deploy rollback > /dev/null && test -w /var/lib/wildlife/inbox && printf "Deployment sudo permissions and writable inbox: verified\n"'
