name: Server Common CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wildlife-Sports-Day-Server.sln

      - name: Build
        run: dotnet build Wildlife-Sports-Day-Server.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Wildlife-Sports-Day-Server.sln --configuration Release --no-build

      - name: Test deployment failure paths
        run: bash deploy/server/tests/wildlife-deploy-tests.sh

      - name: Test database backup restoration
        timeout-minutes: 3
        run: bash deploy/server/tests/database-backup-restore-tests.sh
