name: Server CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wildlife-Sports-Day-Server.sln

      - name: Build
        run: dotnet build Wildlife-Sports-Day-Server.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Wildlife-Sports-Day-Server.sln --configuration Release --no-build
